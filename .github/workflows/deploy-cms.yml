name: Deploy CMS
on:
  push:
    branches: [main]
    paths: ['apps/cms/**', '.github/workflows/deploy-cms.yml']
  workflow_dispatch:
concurrency: { group: deploy-cms, cancel-in-progress: false }
jobs:
  deploy:
    # Enable after Cloudflare secrets are set: repo Settings → Variables → DEPLOY_ENABLED=true
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @duy/cms...
      - run: pnpm --filter @duy/cms run deploy:database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter @duy/cms run deploy:app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
