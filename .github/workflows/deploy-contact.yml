name: Deploy contact worker
on:
  push:
    branches: [main]
    paths: ['workers/contact/**']
  workflow_dispatch:
jobs:
  deploy:
    # Enable after Cloudflare secrets are set: repo Settings → Variables → DEPLOY_ENABLED=true
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @duy/contact...
      - run: pnpm --filter @duy/contact exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
